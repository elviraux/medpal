name: Slimsy
packages:
  Adapty:
    url: https://github.com/adaptyteam/AdaptySDK-iOS.git
    exactVersion: 3.15.7
options:
  bundleIdPrefix: com.fastshotai
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.3"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    NEWELL_API_URL: ""
    FASTSHOT_PROJECT_ID: ""
    SLIMSY_MONTHLY_PRODUCT_ID: ""
    SLIMSY_YEARLY_PRODUCT_ID: ""
    ADAPTY_PUBLIC_SDK_KEY: ""
    ADAPTY_PLACEMENT_ID: default
targets:
  Slimsy:
    type: application
    platform: iOS
    sources:
      - path: Slimsy
    dependencies:
      - package: Adapty
        product: Adapty
    configFiles:
      Debug: Configuration/Local.xcconfig
      Release: Configuration/Local.xcconfig
    settings:
      base:
        PRODUCT_NAME: Slimsy
        PRODUCT_BUNDLE_IDENTIFIER: com.fastshotai.slimsy
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Slimsy/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.fastshotai.slimsy.native
    scheme:
      testTargets:
        - SlimsyTests
        - SlimsyUITests
      gatherCoverageData: true
  SlimsyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SlimsyTests]
    dependencies:
      - target: Slimsy
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.fastshotai.slimsy.tests
  SlimsyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SlimsyUITests]
    dependencies:
      - target: Slimsy
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.fastshotai.slimsy.uitests
